name: E2E

on:
  schedule:
    # 00:00 and 12:00 UTC every day. GitHub cron is UTC-only and gives no
    # guarantee of punctuality — runs can be delayed under load.
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'inc/**'
      - 'assets/**'
      - 'novac-woo.php'
      - 'tests/e2e/**'
      - '.wp-env.json'
      - 'playwright.config.js'
      - '.github/workflows/e2e.yml'

# A scheduled run and a push should not fight over the same Docker ports.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Latest catches regressions from WordPress itself; the scheduled run is
        # largely there to notice when a WP or WooCommerce release breaks us.
        wordpress: [ 'latest' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin assets
        run: pnpm run build:webpack

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start WordPress
        run: pnpm run env:start

      - name: Bootstrap the test store
        run: pnpm run env:setup

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          NOVAC_E2E_TOKEN: novac-e2e-local-token

      - name: Collect WordPress debug log
        if: always()
        run: |
          mkdir -p artifacts
          npx wp-env run tests-cli cat /var/www/html/wp-content/debug.log > artifacts/wp-debug.log 2>/dev/null || \
            echo "No debug.log produced." > artifacts/wp-debug.log

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-wp-${{ matrix.wordpress }}
          path: |
            artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop WordPress
        if: always()
        run: pnpm run env:stop || true

  notify:
    name: Report scheduled failure
    runs-on: ubuntu-latest
    needs: e2e
    # Only nag for the unattended runs. A failing PR already shows a red check.
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or update a tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled E2E run is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled E2E run failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              ``,
              `Artifacts on the run include the Playwright HTML report, traces for`,
              `failed specs, and the WordPress debug log.`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-failure',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['e2e-failure'],
              });
            }
